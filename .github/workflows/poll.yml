name: Poll job boards
on:
  schedule:
    - cron: "7,27,47 * * * *"   # ~every 20 min (GitHub adds 5-30 min jitter)
  workflow_dispatch: {}

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh seed lists
        run: node dist/run.cjs seed
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Poll ATS boards
        run: node dist/run.cjs poll
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Wake Corvey's standing loop
        if: always()
        continue-on-error: true
        env:
          LOOP_URL: ${{ secrets.CORVENO_LOOP_URL }}
          LOOP_SECRET: ${{ secrets.CORVENO_CRON_SECRET }}
        run: |
          if [ -n "$LOOP_URL" ]; then
            curl -sS -m 20 -X POST "$LOOP_URL" \
              -H "Authorization: Bearer $LOOP_SECRET" \
              -H "Content-Type: application/json" \
              -d '{"maxUsers":6}' || true
          else
            echo "CORVENO_LOOP_URL not set — skipping wake-up"
          fi
